<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Central Cybersecurity Knowledge Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  
  <!-- ปลั๊กอินสำหรับเมนูแบบเปิด-ปิดได้ -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/sidebar.min.css" />

  <style>
    /* 1. แก้ปัญหารูปภาพในไฟล์ Markdown ไม่ให้ล้นจอ และใช้งานบนมือถือได้ */
    .markdown-section img {
      max-width: 100% !important;
      height: auto !important;
      display: block;
      margin: 15px auto;
      border-radius: 6px; 
    }

    /* 2. ย้ายปุ่ม Hamburger ไปมุมซ้ายบน */
    .sidebar-toggle {
      top: 0 !important;
      bottom: auto !important;
      left: 0 !important;
      padding: 12px 15px !important;
    }

    /* 3. ดันช่องค้นหาลงมาหลบปุ่ม Hamburger */
    .sidebar .search {
      margin-top: 40px !important;
    }

    /* 4. ซ่อนลูกศรทุกประเภทเด็ดขาด ไม่ว่าจะคลุมด้วยแท็กอะไร (a, p, span, strong ฯลฯ) */
    .sidebar .sidebar-nav li.collapse > *:before,
    .sidebar .sidebar-nav li.collapse > *:after,
    .sidebar .sidebar-nav li.open > *:before,
    .sidebar .sidebar-nav li.open > *:after,
    .sidebar .sidebar-nav li.collapse:before,
    .sidebar .sidebar-nav li.collapse:after,
    .sidebar .sidebar-nav li.open:before,
    .sidebar .sidebar-nav li.open:after {
      display: none !important;
      content: "" !important;
      background: none !important;
    }

    /* เปลี่ยนเมาส์เป็นรูปมือ (Pointer) เวลาชี้ทุกหัวข้อ จะได้รู้ว่าคลิกเปิด-ปิดได้ */
    .sidebar .sidebar-nav li.collapse > *,
    .sidebar .sidebar-nav li.open > * {
      cursor: pointer !important;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Cybersecurity Hub',
      repo: 'https://github.com/PurinatWanthanathanya/My-Cybersecurity-Knowledge-Hub',
      homepage: 'home.md',
      basePath: '/',
      auto2top: true,
      loadSidebar: true,
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },
      subMaxLevel: 3,
      sidebarDisplayLevel: 1,
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search across all labs...',
        noData: 'No matching results found'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-sidebar-collapse/dist/docsify-sidebar-collapse.min.js"></script>
</body>
</html>
