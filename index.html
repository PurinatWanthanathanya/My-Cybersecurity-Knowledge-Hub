<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Central Cybersecurity Knowledge Hub</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Cybersecurity Hub',
      repo: 'https://github.com/PurinatWanthanathanya/ชื่อ-Repo-ที่-3-ของคุณ',
      homepage: 'home.md',
      basePath: '/',
      auto2top: true,
      loadSidebar: true,     
      subMaxLevel: 3,       
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search across all labs...',
        noData: 'No matching results found'
      }
    }
  </script>
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
